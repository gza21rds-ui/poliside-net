<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ページが見つかりません（404） | PoliSide</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .code {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 800;
      color: #F97316;
      background: rgba(249, 115, 22, 0.12);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 0.95rem; color: #475569; margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-primary { background: #F97316; color: #FFFFFF; }
    .btn-secondary { background: #F1F5F9; color: #0F172A; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 NOT FOUND</div>
    <h1>お探しのページは見つかりませんでした</h1>
    <p>URLが変更されたか、削除された可能性があります。PoliSideトップページまたは政治活動ノウハウ記事一覧よりお探しください。</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">PoliSide トップへ</a>
      <a href="/insight/" class="btn btn-secondary">ノウハウ記事一覧へ</a>
    </div>
  </main>
</body>
</html>
